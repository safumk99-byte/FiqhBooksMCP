name: Telegram EPUB Poller

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-epub-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout poller state
        uses: actions/checkout@v4
      - name: Restore Telegram update offset
        uses: actions/cache@v4
        with:
          path: .telegram_offset
          key: telegram-offset-${{ github.run_id }}
          restore-keys: |
            telegram-offset-
      - name: Poll Telegram and forward EPUB channel posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          RENDER_INGEST_URL: https://fiqhbooksmcp-1.onrender.com/telegram/webhook
          RENDER_PROCESS_URL: https://fiqhbooksmcp-1.onrender.com/telegram/process-next
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          secret = os.environ["TELEGRAM_WEBHOOK_SECRET"].strip()
          if not token or not secret:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_WEBHOOK_SECRET repository secret")

          offset_path = ".telegram_offset"
          try:
              with open(offset_path, "r", encoding="utf-8") as state_file:
                  offset = int(state_file.read().strip() or "0")
          except (FileNotFoundError, ValueError):
              offset = 0

          def request_json(url, method="GET", headers=None, payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          base = f"https://api.telegram.org/bot{token}"
          # Switch the bot from webhook delivery to getUpdates without discarding queued posts.
          request_json(base + "/deleteWebhook", method="POST",
                       headers={"Content-Type": "application/json"},
                       payload={"drop_pending_updates": False})
          query = urllib.parse.urlencode({
              "offset": offset,
              "timeout": 0,
              "allowed_updates": json.dumps(["channel_post"]),
          })
          result = request_json(base + "/getUpdates?" + query, timeout=45)
          updates = result.get("result", [])
          print(f"Telegram updates received: {len(updates)}")

          new_offset = offset
          for update in updates:
              update_id = int(update["update_id"])
              message = update.get("channel_post") or {}
              document = message.get("document") or {}
              filename = str(document.get("file_name") or "")
              if filename.lower().endswith(".epub"):
                  body = json.dumps(update).encode()
                  req = urllib.request.Request(
                      os.environ["RENDER_INGEST_URL"],
                      data=body,
                      method="POST",
                      headers={
                          "Content-Type": "application/json",
                          "X-Telegram-Bot-Api-Secret-Token": secret,
                      },
                  )
                  # A sleeping Render instance may need time to wake. On failure,
                  # stop without advancing the cursor so Telegram can be retried.
                  with urllib.request.urlopen(req, timeout=240) as response:
                      payload = json.loads(response.read() or b"{}")
                      if response.status < 200 or response.status >= 300:
                          raise RuntimeError(f"Render ingest returned HTTP {response.status}")
                      print(f"Forwarded {filename}: {payload.get('status', payload.get('ignored', 'accepted'))}")
              new_offset = max(new_offset, update_id + 1)

          if new_offset != offset:
              with open(offset_path, "w", encoding="utf-8") as state_file:
                  state_file.write(str(new_offset))
          print(f"Telegram poll checkpoint: {new_offset}")

          # Process one durable queued EPUB per scheduled run. If Render is
          # waking from sleep, the request timeout allows the instance to start.
          worker_req = urllib.request.Request(
              os.environ["RENDER_PROCESS_URL"],
              data=b"{}",
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Telegram-Bot-Api-Secret-Token": secret,
              },
          )
          with urllib.request.urlopen(worker_req, timeout=240) as response:
              worker_result = json.loads(response.read() or b"{}")
              print("EPUB worker:", worker_result.get("status", "unknown"))
          PY
